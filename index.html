<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hertash</title>
<style>
body{font-family:sans-serif;max-width:700px;margin:0 auto;padding:20px;background:#0a0a0a;color:#fff}
#chat{height:70vh;overflow-y:auto;border:1px solid #333;border-radius:12px;padding:15px;margin-bottom:15px;background:#111}
.msg{margin:10px 0;padding:10px 14px;border-radius:10px;max-width:80%;word-wrap:break-word}
.user{background:#2563eb;margin-left:auto}
.bot{background:#222}
#bar{display:flex;gap:10px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
button{padding:12px 20px;border-radius:10px;border:0;background:#2563eb;color:#fff;cursor:pointer}
</style>
</head>
<body>
<h1>hertash</h1>
<p>Hertash AI - Kişisel yapay zekâ asistanı</p>
<div id="chat"><div class="msg bot">Merhaba! Ben Hertash. Sana nasıl yardımcı olabilirim?</div></div>
<div id="bar">
<input id="input" placeholder="Bir şey yaz..." onkeydown="if(event.key==='Enter')sor()">
<button onclick="sor()">Gönder</button>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const SUPABASE_URL = "https://cvuoegfzqdnsnpnfcxyq.supabase.co"
const SUPABASE_ANON_KEY = "sb_publishable_Ew-1_uEyjjFOQgUw7iXtGw_BIdVkzIa"
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const session_id = localStorage.getItem("hertash_session") || crypto.randomUUID()
localStorage.setItem("hertash_session", session_id)

window.sor = async function(){
  const inputEl = document.getElementById("input")
  const msg = inputEl.value.trim()
  if(!msg) return
  inputEl.value = ""
  const chat = document.getElementById("chat")
  chat.innerHTML += `<div class="msg user">${msg}</div>`
  chat.scrollTop = chat.scrollHeight

  try {
    const { data, error } = await supabase.functions.invoke("lefttash-brain", {
      body: { message: msg, session_id }
    })
    if(error) throw error
    chat.innerHTML += `<div class="msg bot">${data.reply}</div>`
  } catch(e){
    chat.innerHTML += `<div class="msg bot">Hata: ${e.message}</div>`
    console.error(e)
  }
  chat.scrollTop = chat.scrollHeight
}
</script>
</body>
</html>
